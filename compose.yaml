services:
  webserver:
    image: caddy:2-alpine
    container_name: webserver
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /path/to/share:/srv:ro

    read_only: true

    tmpfs:
      - /data/caddy
      - /config/caddy
      - /tmp

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true
