services:
  webserver:
    image: caddy:2-alpine
    container_name: webserver
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8080}:8080"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SHARE_DIR:?Please set SHARE_DIR}:/srv:ro

    read_only: true

    tmpfs:
      - /data/caddy
      - /config/caddy
      - /tmp

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
